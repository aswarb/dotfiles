[font]
size = 11
offset = { x = 0, y = -1 } 

[font.normal]
#family = "JetBrainsMono NF"
#family = "BlexMono Nerd Font Mono"
family = "IosevkaTerm Nerd Font Mono"
#family = "FiraCode Nerd Font Mono"
style = "Regular"

[window]
decorations = "None"
opacity = 0.8
padding = { x = 0, y = 2 }
dynamic_padding = true

[terminal]
osc52 = "CopyPaste"

[keyboard]
bindings = [
  { key = "C", mods = "Control|Shift", action = "Copy" },
  { key = "V", mods = "Control|Shift", action = "Paste" },
]

[general]
#import = ["./themes/themes/vesper.toml"]
import = ["./cynosure_dark.toml"]
#import = ["./perigee_dark.toml"]
#import = ["./augur_dark.toml"]
#import = ["./themes/themes/kanagawa_dragon.toml"]
#import = ["./themes/themes/nord.toml"]
