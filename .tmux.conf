
set -g mouse on

# unbind-key C-b
# set -g prefix 'C-\'
# bind-key 'C-\' send-prefix

set-option -g default-command zsh

# Truecolor. `terminal-features` is the modern replacement for the `Tc`
# override; both the alacritty and xterm-256color entries are listed because
# .zshrc rewrites TERM to xterm-256color, so either can reach tmux.
set -g default-terminal "alacritty"
set -as terminal-features ",alacritty*:RGB"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",*256col*:RGB"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'

# COLORTERM is how most TUIs decide whether 24-bit is safe. It was set to
# "tmux-256color", which is a TERM value, not a COLORTERM value -- nothing
# recognises it, so tools fell back to 256 colours inside tmux. The only
# meaningful values are "truecolor" and "24bit".
set-environment -g COLORTERM "truecolor"
# ── status bar ────────────────────────────────────────────────────────────
#
# minimal-tmux-status was removed: it owned the whole status line and painted
# it #000000 on #eFeFdF, which is not this desktop.
#
# Same idiom as the editor's bars. The plane is one quiet raised surface; the
# active thing is marked with a solid fill, never a rule -- tmux only forwards
# coloured underlines when the terminal entry advertises Setulc, and neither
# alacritty's nor tmux-256color's does. Idle windows are bare ink on the plane.
#
#   session name   vermilion block, surface-colour text
#   active window  charcoal fill, vermilion text
#   idle window    ink 3, no fill
#
#   INK_DATA  #f0ebe5   INK_BODY #cdc6bc   INK_MACHINE #a8a299
#   INK_FRAME #7a746a   RAISED   #1A1716   FILL        #2E2725
#   RULE      #2C2826   VERMILION #D9534A  SURFACE     #131111

set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 60

set -g status-style "bg=#1A1716,fg=#a8a299"

set -g status-left "#[bg=#D9534A,fg=#131111,bold] #S #[bg=#1A1716,fg=#a8a299] "

setw -g window-status-format         "#[fg=#7a746a] #I #W #[default]"
setw -g window-status-current-format "#[bg=#2E2725,fg=#D9534A,bold] #I #W #[default]"
setw -g window-status-separator ""
setw -g window-status-activity-style "fg=#d49050"
setw -g window-status-bell-style     "fg=#d96060"

set -g status-right "#[fg=#7a746a]#{?client_prefix,PREFIX  ,}#[fg=#a8a299]#h #[fg=#7a746a]· #[fg=#cdc6bc]%H:%M "

# Panes: the focused one takes the accent, as the focused window does
# everywhere else on the desktop. Inactive borders are the hairline rule.
set -g pane-border-style        "fg=#2C2826"
set -g pane-active-border-style "fg=#D9534A"
set -g pane-border-lines single

# Messages and the command prompt sit on the selection fill.
set -g message-style         "bg=#2E2725,fg=#f0ebe5"
set -g message-command-style "bg=#2E2725,fg=#f0ebe5"

# ── copy mode ─────────────────────────────────────────────────────────────
#
# mode-style covers both the selection and the scroll-position indicator in
# the corner. It was on the #2E2725 selection fill, which is 1.28:1 against
# the pane -- fine for a tab that is also marked by its text colour, useless
# for a highlight that has nothing else to distinguish it. A block you are
# meant to see needs a real fill.
#
# Search matches follow alacritty exactly, so finding text behaves the same
# in the terminal and in tmux: every match in peach, the focused one in
# vermilion.
set -g mode-style                     "bg=#f0ebe5,fg=#131111"
set -g copy-mode-match-style          "bg=#EDC99A,fg=#131111"
set -g copy-mode-current-match-style  "bg=#D9534A,fg=#131111"
set -g copy-mode-mark-style           "bg=#949fb5,fg=#131111"

# A scrollbar, but only while scrolling -- `modal` shows it in copy mode and
# hides it the rest of the time, so nothing is permanently stealing a column.
set -g pane-scrollbars modal
set -g pane-scrollbars-position right
set -g pane-scrollbars-style "bg=#241C1B,fg=#7a746a,width=1"
set -g display-panes-colour        "#7a746a"
set -g display-panes-active-colour "#D9534A"
set -g clock-mode-colour "#D9534A"
set -s set-clipboard on

# tmux copy mode yanks to wayland clipboard
set -g mode-keys vi
bind v copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X stop-selection

# paste from wayland clipboard
bind p run-shell "wl-paste --no-newline | tmux load-buffer - && tmux paste-buffer"
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)

set -g update-environment "WAYLAND_DISPLAY"

set -s extended-keys on
set -as terminal-features ',alacritty:clipboard'

run '~/.tmux/plugins/tpm/tpm'
